server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}

spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          "[/**]":
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
            allowedMethods: GET,POST,PUT,DELETE,OPTIONS
            allowedHeaders: "*"
      discovery:
        locator:
          enabled: false
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/produit/**,/categorieProduit/**,/stock/**
        - id: supplier-service
          uri: lb://supplier-service
          predicates:
            - Path=/fournisseur/**,/secteurActivite/**
        - id: invoice-service
          uri: lb://invoice-service
          predicates:
            - Path=/facture/**,/operateur/**,/reglement/**
