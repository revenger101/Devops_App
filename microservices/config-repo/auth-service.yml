server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/auth_db?createDatabaseIfNotExist=true&useUnicode=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false

jwt:
  # no default on purpose: the service refuses to start without a real secret (min 32 chars)
  secret: ${JWT_SECRET}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

auth:
  admin:
    # optional bootstrap admin, created at startup only when a password is provided
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
