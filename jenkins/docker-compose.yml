services:
  jenkins:
    build: .
    container_name: jenkins
    restart: unless-stopped
    user: root                      # needed to use the Docker socket on Docker Desktop
    ports:
      - "8090:8080"
      - "50000:50000"
    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

  sonarqube:
    image: sonarqube:9.9-community
    container_name: sonarqube
    restart: unless-stopped
    depends_on: [sonar-db]
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar-local}
      # Docker Desktop (WSL2) has vm.max_map_count too low for Elasticsearch's mmap store
      SONAR_SEARCH_JAVAADDITIONALOPTS: -Dnode.store.allow_mmap=false
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions

  sonar-db:
    image: postgres:15-alpine
    container_name: sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar-local}
      POSTGRES_DB: sonar
    volumes:
      - sonar-db-data:/var/lib/postgresql/data

  nexus:
    image: sonatype/nexus3:3.70.1
    container_name: nexus
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      INSTALL4J_ADD_VM_PARAMS: -Xms512m -Xmx1g -XX:MaxDirectMemorySize=1g
    volumes:
      - nexus-data:/nexus-data

volumes:
  nexus-data:
  jenkins-data:
  sonar-data:
  sonar-extensions:
  sonar-db-data:
