services:
  jenkins:
    build: .
    container_name: jenkins
    restart: unless-stopped
    user: root                      # needed to use the Docker socket on Docker Desktop
    ports:
      - "8090:8080"
      - "50000:50000"
    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
volumes:
  jenkins-data:
